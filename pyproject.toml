[project]
name = "rote"
version = "0.1.0"
description = "Discover a UI task once with an LLM, then replay it deterministically forever - computer-use automation capabilities for legacy back-office apps"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "pydantic>=2.5",
    "anthropic>=0.30",
    "flask>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
